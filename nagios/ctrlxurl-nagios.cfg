# =============================================================
# Nagios Configuration — CtrlXURL Monitoring
#
# Ye config 4 cheezein monitor karta hai:
#   1. Server alive hai ya nahi (Ping)
#   2. /health endpoint 200 OK de raha hai ya nahi
#   3. Disk usage (> 80% WARN, > 90% CRITICAL)
#   4. CPU Load (> 5,4,3 WARN, > 10,8,6 CRITICAL)
#
# Alert milegi: ankitmina2512@gmail.com par
#
# NOTE: Disk aur Load checks ke liye NRPE chahiye:
#   sudo apt-get install nagios-nrpe-server nagios-plugins -y
# =============================================================

# ── Contact: Alert email ───────────────────────────────────────────────────
define contact {
    contact_name                    ankit
    alias                           Ankit Meena
    email                           ankitmina2512@gmail.com
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    c,r
    host_notification_options       d,r
    service_notification_commands   notify-service-by-email
    host_notification_commands      notify-host-by-email
}

define contactgroup {
    contactgroup_name   ctrlxurl-team
    alias               CtrlXURL Team
    members             ankit
}

# ── Time Period ─────────────────────────────────────────────────────────────
define timeperiod {
    timeperiod_name 24x7
    alias           Always
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
}

# ── Host: Production Server ─────────────────────────────────────────────────
# IMPORTANT: address ko apne server IP se badlo!
define host {
    host_name               ctrlxurl-server
    alias                   CtrlXURL Production Server
    address                 YOUR_SERVER_IP
    check_command           check-host-alive
    max_check_attempts      3
    notification_interval   60
    notification_period     24x7
    notification_options    d,r
    contacts                ankit
}

# ── Check 1: Server Alive (Ping) ────────────────────────────────────────────
define service {
    host_name               ctrlxurl-server
    service_description     Server Alive - Ping
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
    check_interval          5
    notification_interval   60
    notification_period     24x7
    notification_options    c,r
    contact_groups          ctrlxurl-team
}

# ── Check 2: Backend Health Endpoint ────────────────────────────────────────
# GET http://YOUR_SERVER_IP:3000/health → must return HTTP 200
define service {
    host_name               ctrlxurl-server
    service_description     Backend Health - /health
    check_command           check_http!-p 3000 -u /health
    max_check_attempts      3
    check_interval          3
    notification_interval   30
    notification_period     24x7
    notification_options    c,r
    contact_groups          ctrlxurl-team
    notes                   App band ho to turant alert aayega!
}

# ── Check 3: Disk Usage ─────────────────────────────────────────────────────
# check_disk -w 20% -c 10% -p /
#   -w 20%  → WARN  jab disk par sirf 20% free bache  (yaani 80% full)
#   -c 10%  → CRIT  jab disk par sirf 10% free bache  (yaani 90% full)
define command {
    command_name    check_remote_disk
    command_line    /usr/lib/nagios/plugins/check_nrpe -H '$HOSTADDRESS$' -c check_disk
}

define service {
    host_name               ctrlxurl-server
    service_description     Disk Usage - /
    check_command           check_remote_disk
    max_check_attempts      3
    check_interval          10
    notification_interval   120
    notification_period     24x7
    notification_options    w,c,r
    contact_groups          ctrlxurl-team
    notes                   Disk 80% full = WARN | 90% full = CRITICAL
}

# ── Check 4: CPU Load Average ───────────────────────────────────────────────
# check_load -w 5,4,3 -c 10,8,6
#   Thresholds: 1min load, 5min load, 15min load
#   WARN  jab load: 5 / 4 / 3  se zyada ho
#   CRIT  jab load: 10 / 8 / 6 se zyada ho
define command {
    command_name    check_remote_load
    command_line    /usr/lib/nagios/plugins/check_nrpe -H '$HOSTADDRESS$' -c check_load
}

define service {
    host_name               ctrlxurl-server
    service_description     CPU Load Average
    check_command           check_remote_load
    max_check_attempts      3
    check_interval          5
    notification_interval   60
    notification_period     24x7
    notification_options    w,c,r
    contact_groups          ctrlxurl-team
    notes                   High CPU load = app slow ho sakta hai
}


