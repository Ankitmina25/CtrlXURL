# =============================================================
# Nagios Configuration — CtrlXURL Monitoring
#
# Nagios ek open-source monitoring tool hai.
# Ye continuously check karta hai ki application services
# live hain ya nahi, aur failure par alert generate karta hai.
#
# Is config mein 4 checks defined hain:
#   1. Backend Container Alive  — Ping check
#   2. Backend API /health      — HTTP 200 response check
#   3. Disk Usage               — WARN >80%, CRITICAL >90%
#   4. CPU Load                 — WARN >5, CRITICAL >10
#
# Docker network mein backend container ka hostname = "backend"
# Alert email: ankitmina2512@gmail.com
# =============================================================

# ── Contact: Who receives alerts ───────────────────────────────────────────
define contact {
    contact_name                    ankit
    alias                           Ankit Meena
    email                           ankitmina2512@gmail.com
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    c,r    # c=critical, r=recovery
    host_notification_options       d,r    # d=down, r=recovery
    service_notification_commands   notify-service-by-email
    host_notification_commands      notify-host-by-email
}

define contactgroup {
    contactgroup_name   ctrlxurl-team
    alias               CtrlXURL Team
    members             ankit
}

# ── Host Definition ─────────────────────────────────────────────────────────
# "backend" is the Docker container hostname on ctrlxurl-net network
define host {
    host_name               ctrlxurl-backend
    alias                   CtrlXURL Backend Container
    address                 backend
    check_command           check-host-alive
    max_check_attempts      3
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    d,r
    contacts                ankit
}

# ── Check 1: Ping — Is backend container reachable? ────────────────────────
# WARN  : response > 100ms or 20% packet loss
# CRITICAL : response > 500ms or 60% packet loss
define service {
    host_name               ctrlxurl-backend
    service_description     Backend Container Alive
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
    check_interval          5
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    c,r
    contact_groups          ctrlxurl-team
}

# ── Check 2: HTTP /health — Is the Node.js API responding? ─────────────────
# Nagios sends GET http://backend:3000/health
# If response is not HTTP 200 OK -> CRITICAL alert
define service {
    host_name               ctrlxurl-backend
    service_description     Backend API Health Check
    check_command           check_http!-H backend -p 3000 -u /health
    max_check_attempts      3
    check_interval          3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    c,r
    contact_groups          ctrlxurl-team
    notes                   GET /health must return HTTP 200
}

# ── Check 3: Disk Usage ─────────────────────────────────────────────────────
# Monitors disk space on the / (root) partition
# WARN     : less than 20% free space remaining (i.e. 80% full)
# CRITICAL : less than 10% free space remaining (i.e. 90% full)
define service {
    host_name               ctrlxurl-backend
    service_description     Disk Usage
    check_command           check_local_disk!20%!10%!/
    max_check_attempts      3
    check_interval          10
    check_period            24x7
    notification_interval   120
    notification_period     24x7
    notification_options    w,c,r
    contact_groups          ctrlxurl-team
    notes                   WARN 80% full - CRITICAL 90% full
}

# ── Check 4: CPU Load Average ───────────────────────────────────────────────
# Monitors 1-minute, 5-minute, 15-minute CPU load averages
# WARN     : load exceeds 5.0 / 4.0 / 3.0
# CRITICAL : load exceeds 10.0 / 8.0 / 6.0
define service {
    host_name               ctrlxurl-backend
    service_description     CPU Load
    check_command           check_local_load!5.0,4.0,3.0!10.0,8.0,6.0
    max_check_attempts      3
    check_interval          5
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,c,r
    contact_groups          ctrlxurl-team
    notes                   WARN load 5 - CRITICAL load 10
}
