<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth UI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="auth-card">
      <div class="card-header">
        <p class="eyebrow">Simple Auth</p>
        <h1>Welcome</h1>
        <p class="subtext">Login ya register karo, phir OTP verify karo.</p>
      </div>

      <div class="tabs" role="tablist" aria-label="Authentication tabs">
        <button class="tab active" data-target="loginForm" type="button">Login</button>
        <button class="tab" data-target="registerForm" type="button">Register</button>
      </div>

      <form id="loginForm" class="form-panel active">
        <label>
          <span>Email</span>
          <input type="email" name="email" placeholder="Enter your email" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" placeholder="Enter your password" required />
        </label>
        <button type="submit">Login</button>
      </form>

      <form id="registerForm" class="form-panel">
        <label>
          <span>Username</span>
          <input type="text" name="username" placeholder="Enter your username" required />
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" placeholder="Enter your email" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" placeholder="Create a password" required />
        </label>
        <button type="submit">Register</button>
      </form>

      <form id="otpForm" class="form-panel otp-panel">
        <label>
          <span>Email</span>
          <input type="email" name="email" id="otpEmail" placeholder="Enter email" required />
        </label>
        <label>
          <span>OTP</span>
          <input type="text" name="otp" placeholder="Enter OTP" maxlength="6" required />
        </label>
        <button type="submit">Verify OTP</button>
      </form>

      <p id="statusMessage" class="status-message"></p>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
